<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>OpenStats Desktop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .launcher-card {
      width: 460px;
      height: 290px;
      background: #0e1118;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-top: 3px solid #22b8cf;
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 30px;
      color: #eaf0f8;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo-badge {
      width: 44px;
      height: 44px;
      background: #151a24;
      border: 1px solid rgba(34, 184, 207, 0.4);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-badge svg {
      width: 24px; height: 24px; fill: none; stroke: #22b8cf;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }
    .brand-title {
      font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: #eaf0f8;
    }
    .brand-subtitle {
      font-size: 12px; color: #8494aa; margin-top: 2px;
    }
    .status-container { margin-top: 16px; }
    .status-text {
      font-size: 12px; color: #b8c4d4; margin-bottom: 10px;
      display: flex; justify-content: space-between;
      font-variant-numeric: tabular-nums;
    }
    .progress-bar-bg {
      width: 100%; height: 4px; background: #1d2433;
      border-radius: 3px; overflow: hidden; position: relative;
    }
    .progress-bar-fill {
      position: absolute; top: 0; left: 0; height: 100%; width: 42%;
      background: #22b8cf; border-radius: 3px;
      animation: sweep-progress 1.4s infinite ease-in-out;
    }
    @keyframes sweep-progress {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(250%); }
    }
    .footer {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: #5c6b80;
      border-top: 1px solid rgba(148, 163, 184, 0.14); padding-top: 12px;
      font-variant-numeric: tabular-nums;
    }
    .tag {
      background: rgba(34, 184, 207, 0.14); color: #67e8f9;
      padding: 2px 8px; border-radius: 4px; font-weight: 700;
      border: 1px solid rgba(34, 184, 207, 0.25);
    }
  </style>
</head>
<body>
  <div class="launcher-card">
    <div class="brand">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
      </div>
      <div>
        <div class="brand-title">OpenStats Desktop</div>
        <div class="brand-subtitle">Poste d’Analyse Statistique &amp; Data Science — ElmasCore</div>
      </div>
    </div>

    <div class="status-container">
      <div class="status-text">
        <span id="statusMessage">Initialisation du moteur DuckDB &amp; Python…</span>
        <span id="statusPercent">Local</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill"></div>
      </div>
    </div>

    <div class="footer">
      <span>ElmasCore Laboratory · Traitement 100 % local</span>
      <span class="tag">v1.0.0-rc.2 Desktop</span>
    </div>
  </div>
</body>
</html>
